name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Build & Test
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Format check
        run: cargo fmt --check

  check-linux:
    name: Build & Test (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install dependencies
        timeout-minutes: 10
        run: bash .github/scripts/apt-install.sh libxkbcommon-dev libwayland-dev libglib2.0-dev libgtk-3-dev libxdo-dev
      - name: Build
        run: cargo build
      - name: Test
        run: cargo test
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: Format check
        run: cargo fmt --check

  e2e-linux:
    name: End-to-end (Linux, virtual display)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install dependencies
        timeout-minutes: 10
        run: >-
          bash .github/scripts/apt-install.sh
          libxkbcommon-dev libwayland-dev libglib2.0-dev libgtk-3-dev libxdo-dev
          xvfb openbox stalonetray xdotool xclip imagemagick x11-xserver-utils x11-utils
          python3-pil python3-xlib python3-dbus python3-gi dbus-x11 libayatana-appindicator3-1
          libxkbcommon-x11-0
      - name: Build
        run: cargo build
      - name: Usage tests
        env:
          E2E_ARTIFACTS: ${{ runner.temp }}/e2e-artifacts
        run: bash tests/e2e/run.sh target/debug/screen-mark
      - name: Keep screenshots and logs of failed tests
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failures
          path: ${{ runner.temp }}/e2e-artifacts
          if-no-files-found: ignore
          retention-days: 14

  msrv:
    name: Minimum Rust version
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version Cargo.toml promises, so the two can't drift apart.
      - name: Read rust-version
        id: msrv
        shell: bash
        run: echo "version=$(sed -n 's/^rust-version = "\(.*\)"\r\{0,1\}$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check with the locked dependencies
        run: cargo check --locked --all-targets

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # Advisory only — a freshly published CVE in a dependency shouldn't block
    # unrelated PRs, but it should be visible on every run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit dependencies
        run: cargo audit

  art:
    # The README panel is generated; fail if docs/assets/panel-*.svg no longer match docs/art/make-panel.py.
    name: README panel
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - name: Redraw the panel
        run: |
          python -m pip install --quiet -r docs/art/requirements.txt
          python docs/art/make-panel.py
          git diff --exit-code -- docs/assets/panel-dark.svg docs/assets/panel-light.svg
