name: Release

# A release carries only what someone needs to install screen-mark:
# - the Windows MSI and zip, and the Linux tar.gz. Each holds the README, changelog,
#   licence and THIRD-PARTY-LICENSES.txt, and the Windows exe has no Visual C++
#   runtime dependency.
# - SHA256SUMS.txt for those three.
# - latest.json and latest.json.sig: what the built-in updater reads. The first names
#   the Windows and Linux downloads with their sizes and SHA-256, the second signs it.
#
# Pushing a v* tag publishes a release. Running the workflow by hand
# (workflow_dispatch) builds and packages everything as workflow artifacts and
# publishes nothing, so it works as a dry run.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # cargo-about writes THIRD-PARTY-LICENSES.txt. Pinned, with the checksums of its
  # release archives from github.com/EmbarkStudios/cargo-about/releases.
  CARGO_ABOUT_VERSION: 0.9.3
  CARGO_ABOUT_SHA256_LINUX: 3ad1e94ea1e63d69d1961f4fb15ccbbe9575d906111f96d2cb4dce6df48f71b4
  CARGO_ABOUT_SHA256_WINDOWS: 9e2942533ef1c592c4a70bdb384cae1550a3f5fc9ae40379b6662e3d2f16fe02

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Read the version
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"\r\{0,1\}$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the Cargo.toml version, $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build release
        run: cargo build --release --locked
      - name: Check the exe needs no Visual C++ runtime
        run: |
          if grep -qai 'vcruntime140' target/release/screen-mark.exe; then
            echo "::error::screen-mark.exe imports VCRUNTIME140.dll. The C runtime should be linked in (.cargo/config.toml)."; exit 1
          fi
      - name: Write third-party licences
        run: |
          name="cargo-about-$CARGO_ABOUT_VERSION-x86_64-pc-windows-msvc"
          curl -sSfL -o about.tar.gz "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256_WINDOWS *about.tar.gz" | sha256sum -c -
          mkdir -p ../about-tool && tar -xzf about.tar.gz -C ../about-tool && rm about.tar.gz
          "../about-tool/$name/cargo-about.exe" generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: Install cargo-wix
        run: cargo install cargo-wix
      - name: Build MSI installer
        run: cargo wix --no-build --nocapture -o "screen-mark-$VERSION-windows-x64.msi"
      - name: Package ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          Copy-Item target/release/screen-mark.exe, README.md, CHANGELOG.md, LICENSE, THIRD-PARTY-LICENSES.txt release/
          Compress-Archive -Path release/* -DestinationPath "screen-mark-$env:VERSION-windows-x64.zip" -Force
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binary
          if-no-files-found: error
          path: |
            screen-mark-*-windows-x64.zip
            screen-mark-*-windows-x64.msi

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Read the version
        run: |
          version="v$(sed -n 's/^version = "\(.*\)"\r\{0,1\}$/\1/p' Cargo.toml | head -n 1)"
          if [[ "$GITHUB_REF_TYPE" == tag && "$GITHUB_REF_NAME" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match the Cargo.toml version, $version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install dependencies
        timeout-minutes: 10
        run: bash .github/scripts/apt-install.sh libxkbcommon-dev libwayland-dev libglib2.0-dev libgtk-3-dev libxdo-dev
      - name: Build release
        run: cargo build --release --locked
      - name: Write third-party licences
        run: |
          name="cargo-about-$CARGO_ABOUT_VERSION-x86_64-unknown-linux-musl"
          curl -sSfL -o about.tar.gz "https://github.com/EmbarkStudios/cargo-about/releases/download/$CARGO_ABOUT_VERSION/$name.tar.gz"
          echo "$CARGO_ABOUT_SHA256_LINUX *about.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/about" && tar -xzf about.tar.gz -C "$RUNNER_TEMP/about" && rm about.tar.gz
          "$RUNNER_TEMP/about/$name/cargo-about" generate --locked --fail about.hbs -o THIRD-PARTY-LICENSES.txt
      - name: Package
        run: |
          mkdir release
          cp target/release/screen-mark README.md CHANGELOG.md LICENSE THIRD-PARTY-LICENSES.txt release/
          chmod +x release/screen-mark
          tar -czf "screen-mark-$VERSION-linux-x64.tar.gz" -C release screen-mark README.md CHANGELOG.md LICENSE THIRD-PARTY-LICENSES.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-binary
          if-no-files-found: error
          path: screen-mark-*-linux-x64.tar.gz

  package:
    name: Update manifest and checksums
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: '*-binary'
          merge-multiple: true
          path: dist
      - name: Read the version
        run: echo "VERSION=v$(sed -n 's/^version = "\(.*\)"\r\{0,1\}$/\1/p' Cargo.toml | head -n 1)" >> "$GITHUB_ENV"
      - name: Write and sign the update manifest
        # latest.json lists this release's downloads with their sizes and SHA-256;
        # latest.json.sig signs it. An installed screen-mark updates only from a
        # manifest signed with a key in src/update/keys.rs, and the script checks
        # that before anything is published. The key is the UPDATE_SIGNING_KEY
        # secret (CONTRIBUTING.md, "Releases and the update key").
        env:
          UPDATE_SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          if [[ -z "$UPDATE_SIGNING_KEY" ]]; then
            if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              echo "::error::The UPDATE_SIGNING_KEY secret is not set. Without it this release would have no signed update manifest, and installed copies could not update to it."; exit 1
            fi
            echo "::warning::UPDATE_SIGNING_KEY is not set, so this dry run has no update manifest."
            exit 0
          fi
          bash .github/scripts/update-manifest.sh make dist "$VERSION"
      - name: Check the website links to this release
        # The site in docs/ is deployed from main and links straight to a
        # release's files, so its links have to name the version being released.
        run: |
          base="https://github.com/Real-Fruit-Snacks/screen-mark/releases/download"
          for f in windows-x64.msi windows-x64.zip linux-x64.tar.gz; do
            if ! grep -q "$base/$VERSION/screen-mark-$VERSION-$f" docs/index.html; then
              echo "::error::docs/index.html has no link to screen-mark-$VERSION-$f. Update its links."; exit 1
            fi
          done
          if grep -o "$base/[^/\"]*/" docs/index.html | grep -v "$base/$VERSION/"; then
            echo "::error::docs/index.html still links to release downloads other than $VERSION. Update its links."; exit 1
          fi
      - name: Write checksums
        run: cd dist && sha256sum screen-mark-* > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          if-no-files-found: error
          path: dist/*

  release:
    name: Create Release
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            screen-mark-*
            SHA256SUMS.txt
            latest.json
            latest.json.sig
          generate_release_notes: true
          draft: false
