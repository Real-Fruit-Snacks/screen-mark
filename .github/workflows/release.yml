name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build release
        run: cargo build --release
      - name: Install cargo-wix
        run: cargo install cargo-wix
      - name: Build MSI installer
        run: cargo wix --no-build --nocapture -o screen-mark-${{ github.ref_name }}-windows-x64.msi
      - name: Package ZIP
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item target/release/screen-mark.exe release/
          Compress-Archive -Path release/screen-mark.exe -DestinationPath screen-mark-${{ github.ref_name }}-windows-x64.zip -Force
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-binary
          path: |
            screen-mark-*.zip
            screen-mark-*.msi

  build-linux:
    name: Build (Linux)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libglib2.0-dev libgtk-3-dev libxdo-dev
      - name: Build release
        run: cargo build --release
      - name: Package
        run: |
          mkdir release
          cp target/release/screen-mark release/
          chmod +x release/screen-mark
          tar -czf screen-mark-${{ github.ref_name }}-linux-x64.tar.gz -C release screen-mark

      - name: Package website (self-contained offline hosting bundle)
        run: |
          mkdir -p bundle/docs
          cp -r docs/. bundle/docs/
          cp .gitlab-ci.yml bundle/
          zip -r screen-mark-${{ github.ref_name }}-website.zip bundle
        # The bundle holds the whole static site (HTML, CSS, vendored
        # IBM Plex fonts, SVGs) plus a GitLab Pages CI file,
        # so it can be hosted anywhere — GitHub Pages, GitLab Pages, or an
        # air-gapped web server — with no internet access required.

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-binary
          path: |
            screen-mark-*.tar.gz
            screen-mark-*-website.zip

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            screen-mark-*.zip
            screen-mark-*.tar.gz
            screen-mark-*.msi
          generate_release_notes: true
          draft: false
