<!-- screen-mark cover panel (layout v2): the capture overlay. 528x448, origin = panel top-left.
     Rendered by Real-Fruit-Snacks/rfs-brand tools/make-cover.py; colours are {tokens}.
     Drawn for a 400px card: three windows, one selection, three annotations, the tool bar. -->
<!-- desktop: three windows -->
<rect x="24" y="26" width="272" height="170" rx="8" fill="{window}"/><rect x="24" y="26" width="272" height="28" rx="8" fill="{line}"/>
<rect x="42" y="78" width="168" height="11" rx="3" fill="{line}"/>
<rect x="42" y="104" width="140" height="11" rx="3" fill="{line}"/>
<rect x="42" y="130" width="112" height="11" rx="3" fill="{line}"/>
<rect x="54" y="230" width="322" height="160" rx="8" fill="{window}"/><rect x="54" y="230" width="322" height="28" rx="8" fill="{line}"/>
<rect x="72" y="282" width="190" height="11" rx="3" fill="{line}"/>
<rect x="72" y="308" width="160" height="11" rx="3" fill="{line}"/>
<rect x="340" y="44" width="164" height="262" rx="8" fill="{window}"/><rect x="340" y="44" width="164" height="28" rx="8" fill="{line}"/>
<rect x="358" y="96" width="100" height="11" rx="3" fill="{line}"/>
<rect x="358" y="122" width="76" height="11" rx="3" fill="{line}"/>
<!-- dim everything, then the selected region at full brightness -->
<rect width="528" height="448" fill="{scrim}"/>
<rect x="88" y="82" width="334" height="212" fill="{window}"/><rect x="88" y="82" width="334" height="28" fill="{line}"/>
<rect x="108" y="134" width="214" height="12" rx="3" fill="{line}"/>
<rect x="108" y="162" width="186" height="12" rx="3" fill="{line}"/>
<rect x="108" y="190" width="158" height="12" rx="3" fill="{line}"/>
<rect x="108" y="218" width="130" height="12" rx="3" fill="{line}"/>
<!-- annotations: box, arrow, step marker -->
<rect x="262" y="124" width="132" height="66" rx="3" fill="none" stroke="{ink-red}" stroke-width="4.5"/>
<path d="M134 270 L240 196" stroke="{ink-blue}" stroke-width="5" stroke-linecap="round" fill="none"/><path d="M252 188 L228 191 L242 210 Z" fill="{ink-blue}" stroke="{ink-blue}" stroke-width="2" stroke-linejoin="round"/>
<circle cx="356" cy="250" r="18" fill="{ink-yellow}"/>
<rfs-text font="mono-semibold" size="21" x="356" y="257.5" anchor="middle" fill="{ink-on}">1</rfs-text>
<!-- selection border, handles, size readout -->
<rect x="88" y="82" width="334" height="212" fill="none" stroke="{ember}" stroke-width="2.5"/>
<rect x="83" y="77" width="10" height="10" rx="2" fill="{ember}"/>
<rect x="83" y="289" width="10" height="10" rx="2" fill="{ember}"/>
<rect x="417" y="77" width="10" height="10" rx="2" fill="{ember}"/>
<rect x="417" y="289" width="10" height="10" rx="2" fill="{ember}"/>
<rect x="326" y="304" width="96" height="28" rx="5" fill="{raised}" stroke="{line}"/>
<rfs-text font="mono" size="16" x="374" y="323.5" anchor="middle" fill="{text}">300 × 186</rfs-text>
<!-- tool bar: tool keys, the active tool, ink swatches -->
<rect x="40" y="356" width="448" height="62" rx="12" fill="{surface}" stroke="{line}"/>
<rfs-text font="mono" size="19" x="74" y="393.5" anchor="middle" fill="{mute}">V</rfs-text>
